# -----------------------------------------------------
# Key bindings (Physical layout - keycodes)
# name: "Physical"
# -----------------------------------------------------

# SUPER KEY
$mainMod = SUPER
$HYPRSCRIPTS = ~/.config/hypr/scripts
$SCRIPTS = ~/.config/ml4w/scripts

# Applications
bind = $mainMod, code:36, exec, ~/.config/ml4w/settings/terminal.sh    # Open the terminal (RETURN)
bind = $mainMod, code:56, exec, ~/.config/ml4w/settings/browser.sh          # Open the browser (B)
bind = $mainMod, code:26, exec, ~/.config/ml4w/settings/filemanager.sh      # Open the filemanager (E)
bind = $mainMod CTRL, code:26, exec, ~/.config/ml4w/settings/emojipicker.sh # Open the emoji picker (E)
bind = $mainMod CTRL, code:54, exec, ~/.config/ml4w/settings/calculator.sh  # Open the calculator (C)

# Display
bind = $mainMod SHIFT, mouse_down, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') + 0.5}") # Increase display zoom
bind = $mainMod SHIFT, mouse_up, exec, hyprctl keyword cursor:zoom_factor $(awk "BEGIN {print $(hyprctl getoption cursor:zoom_factor | grep 'float:' | awk '{print $2}') - 0.5}") # Decrease display zoom
bind = $mainMod SHIFT, code:52, exec, hyprctl keyword cursor:zoom_factor 1 # Reset display zoom (Z)

# Windows
bind = $mainMod, code:24, killactive                                                              # Kill active window (Q)
bind = $mainMod SHIFT, code:24, exec, hyprctl activewindow | grep pid | tr -d 'pid:' | xargs kill # Quit active window and all open instances (Q)
bind = $mainMod, code:41, fullscreen, 0                                                           # Set active window to fullscreen (F)
bind = $mainMod, code:58, fullscreen, 1                                                           # Maximize Window (M)
bind = $mainMod, code:28, togglefloating                                                          # Toggle active windows into floating mode (T)
bind = $mainMod SHIFT, code:28, workspaceopt, allfloat                                            # Toggle all windows into floating mode (T)
bind = $mainMod, code:44, togglesplit                                                             # Toggle split (J)
bind = $mainMod, left, movefocus, l                                                         # Move focus left
bind = $mainMod, right, movefocus, r                                                        # Move focus right
bind = $mainMod, up, movefocus, u                                                           # Move focus up
bind = $mainMod, down, movefocus, d                                                         # Move focus down
bindm = $mainMod, mouse:272, movewindow                                                     # Move window with the mouse
bindm = $mainMod, mouse:273, resizewindow                                                   # Resize window with the mouse
bind = $mainMod SHIFT, right, resizeactive, 100 0                                           # Increase window width with keyboard
bind = $mainMod SHIFT, left, resizeactive, -100 0                                           # Reduce window width with keyboard
bind = $mainMod SHIFT, down, resizeactive, 0 100                                            # Increase window height with keyboard
bind = $mainMod SHIFT, up, resizeactive, 0 -100                                             # Reduce window height with keyboard
bind = $mainMod, code:42, togglegroup                                                             # Toggle window group (G)
bind = $mainMod, code:45, swapsplit                                                               # Swapsplit (K)
bind = $mainMod ALT, left, swapwindow, l                                                    # Swap tiled window left
bind = $mainMod ALT, right, swapwindow, r                                                   # Swap tiled window right
bind = $mainMod ALT, up, swapwindow, u                                                      # Swap tiled window up
bind = $mainMod ALT, down, swapwindow, d                                                    # Swap tiled window down
binde = ALT,Tab,cyclenext                                                                   # Cycle between windows
binde = ALT,Tab,bringactivetotop                                                            # Bring active window to the top

# Actions
bind = $mainMod CTRL, code:27, exec, hyprctl reload                                             # Reload Hyprland configuration (R)
bind = $mainMod SHIFT, code:38, exec, $HYPRSCRIPTS/toggle-animations.sh                         # Toggle animations (A)
bind = $mainMod, PRINT, exec, $HYPRSCRIPTS/screenshot.sh                                  # Take a screenshot
bind = $mainMod ALT, code:41, exec, $HYPRSCRIPTS/screenshot.sh --instant                        # Take an instant full-screen screenshot (F)
bind = $mainMod ALT, code:39, exec, $HYPRSCRIPTS/screenshot.sh --instant-area                   # Take an instant area screenshot (S)
bind = $mainMod CTRL, code:24, exec, ~/.config/ml4w/scripts/wlogout.sh                          # Start wlogout (Q)
bind = $mainMod SHIFT, code:25, exec, ~/.config/hypr/scripts/waypaper.sh --random                                         # Change the wallpaper (W)
bind = $mainMod CTRL, code:25, exec, ~/.config/hypr/scripts/waypaper.sh                                                   # Open wallpaper selector (W)
bind = $mainMod ALT, code:25, exec, $HYPRSCRIPTS/wallpaper-automation.sh                        # Start random wallpaper script (W)
bind = $mainMod CTRL, code:36, exec, ~/.config/hypr/scripts/launcher.sh                    # Open application launcher (RETURN)
bind = $mainMod CTRL, code:45, exec, $HYPRSCRIPTS/keybindings.sh                                # Show keybindings (K)
bind = $mainMod SHIFT, code:56, exec, ~/.config/waybar/launch.sh                                # Reload waybar (B)
bind = $mainMod CTRL, code:56, exec, ~/.config/waybar/toggle.sh                                 # Toggle waybar (B)
bind = $mainMod SHIFT, code:27, exec, $HYPRSCRIPTS/loadconfig.sh                                # Reload hyprland config (R)
bind = $mainMod, code:55, exec, $SCRIPTS/cliphist.sh                                            # Open clipboard manager (V)
bind = $mainMod CTRL, code:28, exec, ~/.config/waybar/themeswitcher.sh                          # Open waybar theme switcher (T)
bind = $mainMod CTRL, code:39, exec, flatpak run com.ml4w.settings                              # Open ML4W Dotfiles Settings app (S)
bind = $mainMod ALT, code:42, exec, $HYPRSCRIPTS/gamemode.sh                                    # Toggle game mode (G)
bind = $mainMod CTRL, code:46, exec, ~/.config/hypr/scripts/power.sh lock                       # Launch Hyprshade (L)
bind = $mainMod SHIFT, code:43, exec, $HYPRSCRIPTS/hyprshade.sh                                 # Start wlogout (H)
bind = CTRL, Tab, exec, ~/.config/ml4w/scripts/focus.sh                                   # Open Select Window Menu
bind = CTRL ALT, code:28, exec, ~/.config/ml4w/themes/themes.sh                                   # Open Select Window Menu (T)

# Sidepad
bind = $mainMod CTRL, right, exec, ~/.config/ml4w/scripts/sidepad.sh                      # Open Sidepad
bind = $mainMod CTRL, left, exec, ~/.config/ml4w/scripts/sidepad.sh --hide                # Close Sidepad
bind = $mainMod, code:39, exec, ~/.config/ml4w/scripts/sidepad.sh --init                        # Init Sidepad (S)
bind = $mainMod SHIFT, code:39, exec, ~/.config/ml4w/scripts/sidepad.sh --select                # Select Sidepad (S)

# Workspaces
bind = $mainMod, code:10, workspace, 1  # Open workspace 1
bind = $mainMod, code:11, workspace, 2  # Open workspace 2
bind = $mainMod, code:12, workspace, 3  # Open workspace 3
bind = $mainMod, code:13, workspace, 4  # Open workspace 4
bind = $mainMod, code:14, workspace, 5  # Open workspace 5
bind = $mainMod, code:15, workspace, 6  # Open workspace 6
bind = $mainMod, code:16, workspace, 7  # Open workspace 7
bind = $mainMod, code:17, workspace, 8  # Open workspace 8
bind = $mainMod, code:18, workspace, 9  # Open workspace 9
bind = $mainMod, code:19, workspace, 10 # Open workspace 10

bind = $mainMod SHIFT, code:10, movetoworkspace, 1  # Move active window to workspace 1
bind = $mainMod SHIFT, code:11, movetoworkspace, 2  # Move active window to workspace 2
bind = $mainMod SHIFT, code:12, movetoworkspace, 3  # Move active window to workspace 3
bind = $mainMod SHIFT, code:13, movetoworkspace, 4  # Move active window to workspace 4
bind = $mainMod SHIFT, code:14, movetoworkspace, 5  # Move active window to workspace 5
bind = $mainMod SHIFT, code:15, movetoworkspace, 6  # Move active window to workspace 6
bind = $mainMod SHIFT, code:16, movetoworkspace, 7  # Move active window to workspace 7
bind = $mainMod SHIFT, code:17, movetoworkspace, 8  # Move active window to workspace 8
bind = $mainMod SHIFT, code:18, movetoworkspace, 9  # Move active window to workspace 9
bind = $mainMod SHIFT, code:19, movetoworkspace, 10 # Move active window to workspace 10

bind = $mainMod, Tab, workspace, m+1       # Open next workspace
bind = $mainMod SHIFT, Tab, workspace, m-1 # Open previous workspace

bind = $mainMod CTRL, code:10, exec, $HYPRSCRIPTS/moveTo.sh 1  # Move all windows to workspace 1
bind = $mainMod CTRL, code:11, exec, $HYPRSCRIPTS/moveTo.sh 2  # Move all windows to workspace 2
bind = $mainMod CTRL, code:12, exec, $HYPRSCRIPTS/moveTo.sh 3  # Move all windows to workspace 3
bind = $mainMod CTRL, code:13, exec, $HYPRSCRIPTS/moveTo.sh 4  # Move all windows to workspace 4
bind = $mainMod CTRL, code:14, exec, $HYPRSCRIPTS/moveTo.sh 5  # Move all windows to workspace 5
bind = $mainMod CTRL, code:15, exec, $HYPRSCRIPTS/moveTo.sh 6  # Move all windows to workspace 6
bind = $mainMod CTRL, code:16, exec, $HYPRSCRIPTS/moveTo.sh 7  # Move all windows to workspace 7
bind = $mainMod CTRL, code:17, exec, $HYPRSCRIPTS/moveTo.sh 8  # Move all windows to workspace 8
bind = $mainMod CTRL, code:18, exec, $HYPRSCRIPTS/moveTo.sh 9  # Move all windows to workspace 9
bind = $mainMod CTRL, code:19, exec, $HYPRSCRIPTS/moveTo.sh 10 # Move all windows to workspace 10

bind = $mainMod, mouse_down, workspace, e+1  # Open next workspace
bind = $mainMod, mouse_up, workspace, e-1    # Open previous workspace
bind = $mainMod CTRL, down, workspace, empty # Open the next empty workspace

# Fn keys
bind = , XF86MonBrightnessUp, exec, brightnessctl -q s +10%                                                                                                  # Increase brightness by 10%
bind = , XF86MonBrightnessDown, exec, brightnessctl -q s 10%-                                                                                                # Reduce brightness by 10%
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+                                                                          # Increase volume by 5% (max 100% limit also added hold to raise volume)
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-                                                                               # Reduce volume by 5% (min 0% limit also added hold to lower volume)
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle                                                                                      # Toggle mute
bind = , XF86AudioPlay, exec, playerctl play-pause                                                                                                           # Audio play pause
bind = , XF86AudioPause, exec, playerctl pause                                                                                                               # Audio pause
bind = , XF86AudioNext, exec, playerctl next                                                                                                                 # Audio next
bind = , XF86AudioPrev, exec, playerctl previous                                                                                                             # Audio previous
bind = , XF86AudioMicMute, exec, pactl set-source-mute @DEFAULT_SOURCE@ toggle                                                                               # Toggle microphone
bind = , XF86Calculator, exec, ~/.config/ml4w/settings/calculator.sh                                                                                         # Open calculator
bind = , XF86Lock, exec, hyprlock                                                                                                                            # Open screenlock
bind = , XF86Tools, exec, flatpak run com.ml4w.settings                                                                                                      # Open ML4W Dotfiles Settings app

bind = , code:238, exec, brightnessctl -d smc::kbd_backlight s +10
bind = , code:237, exec, brightnessctl -d smc::kbd_backlight s 10-